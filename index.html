<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Brady's Motorcycle Log</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<!-- Single JS-managed theme-color so the status bar follows a manual theme
     override too (a media-only <meta> can't react to the in-app toggle). -->
<meta name="theme-color" id="theme-color-meta" content="#16181B">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moto Log">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;600;700&family=Archivo:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     THEME SYSTEM
     Three skins (Dark Gauge / Warm Editorial / Vintage Roadster), each with
     a night (default) and day (.light) variant. Skins set tokens only; the
     component rules below consume them. html[data-skin] is set by JS from
     localStorage before first paint of the app screens.
     ===================================================================== */

  /* ---- Dark Gauge (default): neutral graphite, one red accent, Inter. */
  :root{
    --bg:#16181B; --panel:#1E2125; --panel-2:#24272C; --line:#2A2D31;
    --card-line:#2A2D31; --card-shadow:none;
    --well:#101214; --nav-bg:rgba(22,24,27,.96);
    --text:#ECEAE6; --dim:#9BA0A6; --faint:#6E747B; --label:#8A9098;
    --accent:#E01E37; --accent-deep:#7A1521;
    --warn:#E01E37; --warn-soft:#B0182B; --gauge:#4A4F55;
    --btn-text:#F7EFEC;
    --radius:16px;
    --font-ui:'Inter',sans-serif;
    --font-label:'Inter',sans-serif;
    --font-display:'Inter',sans-serif;
    --font-num:'Inter',sans-serif;
    --font-name:'Inter',sans-serif;
    --font-meta:'Inter',sans-serif;
  }
  :root.light{
    --bg:#F4F4F2; --panel:#FFFFFF; --panel-2:#ECECEA; --line:#E2E2DF;
    --card-line:#E2E2DF; --card-shadow:none;
    --well:#EBEBE8; --nav-bg:rgba(244,244,242,.96);
    --text:#1B1D20; --dim:#5E6369; --faint:#9A9FA5; --label:#9A9FA5;
    --accent:#B3362C; --accent-deep:#E3C2BE;
    --warn:#B3362C; --warn-soft:#922B22; --gauge:#C6C6C2;
    --btn-text:#FFFFFF;
  }

  /* ---- Warm Editorial. Day = cream/white pages on warm paper. Night =
     dark burgundy ground, cream type, cream-outlined containers (~50%), kept
     low-glare for night reading. Oxblood is the one filled accent. */
  :root[data-skin="editorial"]{
    --bg:#241317; --panel:#281519; --panel-2:#341E22; --line:rgba(242,231,212,.32);
    --card-line:rgba(242,231,212,.5); --card-shadow:none;
    --well:#1C1014; --nav-bg:rgba(36,19,23,.96);
    --text:#F2E7D4; --dim:#C2A998; --faint:#8F7A6E; --label:#C9A865;
    --accent:#A8362C; --accent-deep:#6B2018;
    --warn:#A8362C; --warn-soft:#C2987E; --gauge:#A8843E;
    --btn-text:#F2E7D4;
    --radius:12px;
    --font-ui:'Source Sans 3',sans-serif;
    --font-label:'Source Sans 3',sans-serif;
    --font-display:'Source Serif 4',Georgia,serif;
    --font-num:'Source Serif 4',Georgia,serif;
    --font-name:'Source Serif 4',Georgia,serif;
    --font-meta:'Source Sans 3',sans-serif;
  }
  :root[data-skin="editorial"].light{
    --bg:#FAF6EF; --panel:#FFFFFF; --panel-2:#F5EFE0; --line:#E5DCC8;
    --card-line:transparent;
    --card-shadow:none;
    --well:#F5EFE0; --nav-bg:rgba(250,246,239,.97);
    --text:#2A1F1A; --dim:#6B5D52; --faint:#9C8E81; --label:#A8843E;
    --accent:#8B2D29; --accent-deep:#DCC3BC;
    --warn:#8B2D29; --warn-soft:#B25652; --gauge:#A8843E;
    --btn-text:#FFFFFF;
  }

  /* ---- Vintage Roadster: cream, near-black, tank red, brass, Oswald
     gauge type. Card borders stay quiet; strong rules are structural only. */
  :root[data-skin="roadster"]{
    --bg:#171310; --panel:#221C15; --panel-2:#2B241B; --line:#564833;
    --card-line:#564833; --card-shadow:none;
    --well:#100D0A; --nav-bg:rgba(23,19,16,.96);
    --text:#EFE7D6; --dim:#AB9F8B; --faint:#776C5B; --label:#AB9F8B;
    --accent:#C04A3E; --accent-deep:#69302A;
    --warn:#C04A3E; --warn-soft:#A03E33; --gauge:#C9A865;
    --btn-text:#F8F1E2;
    --radius:8px;
    --font-ui:'Archivo',sans-serif;
    --font-label:'Oswald',sans-serif;
    --font-display:'Oswald',sans-serif;
    --font-num:'Oswald',sans-serif;
    --font-name:'Archivo',sans-serif;
    --font-meta:'Oswald',sans-serif;
  }
  :root[data-skin="roadster"].light{
    --bg:#F3EDDF; --panel:#FBF7EC; --panel-2:#ECE4D2; --line:#2E2519;
    --card-line:#2E2519; --card-shadow:none;
    --well:#EDE5D2; --nav-bg:rgba(243,237,223,.97);
    --text:#1C1813; --dim:#5F574B; --faint:#94897A; --label:#5F574B;
    --accent:#A52A22; --accent-deep:#E0B9B3;
    --warn:#A52A22; --warn-soft:#7E6A37; --gauge:#A8843E;
    --btn-text:#FBF7EC;
  }

  html{background:var(--bg);}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-ui); font-size:16px;
    max-width:430px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column;
  }
  .eyebrow{
    font-family:var(--font-label); font-weight:600;
    text-transform:uppercase; letter-spacing:.14em; font-size:.72rem; color:var(--label);
  }
  header{
    padding:18px 20px 12px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header .right{display:flex; align-items:center; gap:10px;}
  .theme-toggle{
    background:none; border:none; color:var(--dim);
    line-height:1; cursor:pointer; padding:6px 4px;
    display:inline-flex; align-items:center;
  }
  .theme-toggle:hover{color:var(--text);}
  .theme-toggle svg{width:18px; height:18px; display:block;}
  #settings-btn svg{width:17px; height:17px;}
  .hdr-title .eyebrow{margin-bottom:2px;}
  header .bike{font-family:var(--font-display); font-weight:600; font-size:1.12rem; letter-spacing:-.01em; line-height:1.05;}
  header .bike span{color:var(--faint); font-weight:400; letter-spacing:0; font-size:.82em;}
  main{flex:1; overflow-y:auto; padding:8px 16px 96px;}
  .screen{display:none;}
  .screen.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){ .screen.active{animation:none;} }

  /* ---------- LOG SCREEN ---------- */
  .odo-card{
    background:var(--panel); border:1px solid var(--card-line); border-radius:var(--radius);
    box-shadow:var(--card-shadow);
    padding:20px 18px 22px; margin-top:6px;
  }
  .odo-card .eyebrow{margin-bottom:12px;}
  .odo-input{
    display:flex; align-items:baseline; gap:8px;
    padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .odo-input input{
    flex:1; background:transparent; border:none;
    color:var(--text); font-family:var(--font-num); font-weight:600;
    font-size:3.4rem; line-height:1.1; letter-spacing:.01em; text-align:left;
    font-variant-numeric:tabular-nums;
    padding:0; width:100%; outline:none; caret-color:var(--accent);
  }
  .odo-input input:focus{box-shadow:inset 0 -2px 0 var(--accent);}
  .odo-input .unit{font-family:var(--font-label); color:var(--dim); font-size:1rem; letter-spacing:.1em;}
  .trip-line{
    display:none; justify-content:space-between; align-items:baseline;
    margin-top:14px;
  }
  .trip-line.show{display:flex;}
  .trip-line .lbl{color:var(--dim); font-size:.9rem;}
  .trip-line .val{font-family:var(--font-num); font-weight:600; font-size:1.3rem; color:var(--accent); font-variant-numeric:tabular-nums;}
  .trip-line .val.neg{color:var(--warn);}
  .save-btn{
    width:100%; margin-top:16px; padding:15px;
    background:var(--accent); border:none; border-radius:12px;
    color:var(--btn-text); font-family:var(--font-ui); font-weight:600; font-size:1.05rem;
    cursor:pointer;
  }
  .save-btn:disabled{background:var(--panel-2); color:var(--faint); cursor:default;}
  .save-btn:focus-visible, .tab:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--warn); outline-offset:2px;
  }
  .saved-flash{
    margin-top:10px; text-align:center; font-size:.9rem; color:var(--accent);
    opacity:0; transition:opacity .25s;
  }
  .saved-flash.show{opacity:1;}

  .next-due{margin-top:22px;}
  .next-due .eyebrow{margin-bottom:10px;}

  /* ---------- SERVICE GAUGES ---------- */
  .svc{
    background:var(--panel); border:1px solid var(--card-line); border-radius:var(--radius);
    box-shadow:var(--card-shadow);
    padding:14px 16px; margin-bottom:10px;
  }
  .svc.tappable{cursor:pointer;}
  .svc-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .svc-name{font-family:var(--font-name); font-weight:600; font-size:.98rem;}
  .svc-due{font-family:var(--font-meta); font-size:.82rem; color:var(--dim); font-variant-numeric:tabular-nums;}
  .svc-due.warn{color:var(--warn); font-weight:600;}
  .gauge{height:6px; background:var(--well); border-radius:4px; overflow:hidden;}
  .gauge i{display:block; height:100%; background:var(--gauge); border-radius:4px;}
  .gauge i.warn{background:var(--warn);}
  .svc-sub{margin-top:7px; font-size:.8rem; color:var(--faint);
    display:flex; justify-content:space-between;}
  .svc-actions{margin-top:10px; display:none;}
  .svc.open .svc-actions{display:block;}
  .svc-actions button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:9px 14px; font-family:var(--font-ui);
    font-weight:500; font-size:.9rem; cursor:pointer;
  }
  .svc-actions button.primary{background:var(--warn); border-color:var(--warn); color:var(--btn-text); font-weight:600;}
  .svc-actions .row{display:flex; gap:8px;}

  /* ---------- HISTORY ---------- */
  .month-block{margin-bottom:18px;}
  .month-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:0 4px 8px;
  }
  .month-head .total{font-family:var(--font-num); font-size:.85rem; color:var(--accent); font-variant-numeric:tabular-nums;}
  .ride{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--card-line);
    box-shadow:var(--card-shadow);
    padding:12px 16px; margin-bottom:6px; border-radius:11px;
    cursor:pointer;
  }
  .ride .d{font-family:var(--font-name); font-size:.92rem; color:var(--text);}
  .ride .d small{display:block; color:var(--faint); font-size:.76rem; font-family:var(--font-meta); margin-top:2px; font-variant-numeric:tabular-nums;}
  .ride .trip{font-family:var(--font-num); font-weight:600; font-size:1.05rem; color:var(--accent); font-variant-numeric:tabular-nums;}
  .ride .trip small{color:var(--faint); font-weight:500; font-size:.7rem; margin-left:2px;}
  .ride.service-row .trip{color:var(--warn); font-family:var(--font-name); font-size:.9rem; font-weight:600;}
  .ride.service-row .d small{color:var(--warn-soft);}
  .history-empty{color:var(--faint); text-align:center; padding:40px 0; font-size:.92rem;}

  /* ---------- TABS ---------- */
  nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px;
    background:var(--nav-bg); backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    display:flex; padding:6px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1; background:none; border:none; color:var(--faint);
    font-family:var(--font-label); font-weight:600; font-size:.82rem;
    text-transform:uppercase; letter-spacing:.12em; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0;
  }
  .tab svg{width:22px; height:22px; fill:currentColor;}
  .tab.active{color:var(--accent);}
  .tab .dot{
    position:relative; display:flex; align-items:center; justify-content:center;
  }
  .tab .dot::after{
    content:''; position:absolute; top:-2px; right:-4px; width:7px; height:7px;
    border-radius:50%; background:var(--warn); display:var(--badge,none);
  }

  /* ---------- SHEETS (settings + history edit) ----------
     Additive UI for features the mockup didn't cover (sync, row edit).
     Built from the same tokens; the three core screens are untouched. */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    opacity:0; visibility:hidden; transition:opacity .2s ease; z-index:30;
  }
  .overlay.show{opacity:1; visibility:visible;}
  .sheet{
    position:fixed; left:50%; bottom:0; transform:translate(-50%,100%);
    width:100%; max-width:430px;
    background:var(--panel); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transition:transform .22s ease; z-index:31;
    max-height:88vh; overflow-y:auto;
  }
  .overlay.show .sheet{transform:translate(-50%,0);}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .sheet-head .title{font-family:var(--font-display); font-weight:600; font-size:1.15rem; letter-spacing:.04em;}
  .sheet-close{background:none; border:none; color:var(--dim); font-size:1.4rem; line-height:1; cursor:pointer; padding:4px 6px;}
  .sheet section{margin-bottom:20px;}
  .sheet section .eyebrow{margin-bottom:10px; display:block;}
  .field{margin-bottom:12px;}
  .field label{display:block; color:var(--dim); font-size:.8rem; margin-bottom:5px;}
  .field input{
    width:100%; background:var(--well); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-family:var(--font-ui); font-size:1rem; padding:11px 12px; outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .field input.mono{font-family:var(--font-num); font-variant-numeric:tabular-nums;}
  .btn{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:11px 14px; font-family:var(--font-ui);
    font-weight:500; font-size:.92rem; cursor:pointer;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--btn-text); font-weight:600;}
  .btn.danger{background:none; border-color:var(--warn); color:var(--warn); font-weight:600;}
  .btn.block{display:block; width:100%;}
  .row{display:flex; gap:8px;}
  .row .btn{flex:1;}
  .hint{color:var(--faint); font-size:.8rem; margin-top:8px; line-height:1.45;}
  .status{font-family:var(--font-num); font-size:.8rem; color:var(--dim); margin-top:10px; min-height:1em;}
  .status.err{color:var(--warn);}
  .status.ok{color:var(--accent);}

  /* ---------- THEME PICKER (settings) ---------- */
  .skin-option{
    display:flex; align-items:center; gap:10px; width:100%;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; margin-bottom:8px;
    font-family:var(--font-ui); font-weight:500; font-size:.92rem;
    text-align:left; cursor:pointer;
  }
  .skin-option[aria-pressed="true"]{border-color:var(--accent); color:var(--accent);}
  .skin-option .swatches{display:inline-flex; gap:3px;}
  .skin-option .swatches i{width:12px; height:12px; border-radius:50%; border:1px solid var(--line);}
  .skin-option .check{margin-left:auto; visibility:hidden;}
  .skin-option[aria-pressed="true"] .check{visibility:visible;}

  /* ---------- SIGN-IN GATE ---------- */
  #gate{
    position:fixed; inset:0; z-index:60; background:var(--bg);
    display:none; align-items:center; justify-content:center; text-align:center;
    padding:24px env(safe-area-inset-right) 24px env(safe-area-inset-left);
  }
  #gate.show{display:flex;}
  .gate-card{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .gate-title{font-family:var(--font-display); font-size:2.2rem; line-height:1.1; letter-spacing:.08em; text-transform:uppercase; font-weight:600;}
  .gate-owner{display:block; font-family:var(--font-label); font-size:1rem; font-weight:600; letter-spacing:.3em; color:var(--label); margin-bottom:4px; text-transform:uppercase;}
  .gate-btn{
    display:inline-flex; align-items:center; gap:9px; margin-top:6px;
    background:var(--accent); color:var(--btn-text); text-decoration:none;
    font-family:var(--font-ui); font-weight:600; font-size:.92rem;
    padding:12px 22px; border-radius:999px;
  }
  .gate-btn:active{opacity:.85;}

  /* ---------- PER-SKIN VOICE ----------
     Small typographic moves the tokens can't express. */
  :root[data-skin="editorial"] .trip-line .lbl,
  :root[data-skin="editorial"] .svc-sub{font-family:var(--font-num); font-style:italic;}
  :root[data-skin="editorial"] .month-head .total{font-style:italic;}
  :root[data-skin="editorial"] .gate-title{text-transform:none; letter-spacing:0; font-weight:700;}
  :root[data-skin="editorial"] .save-btn{border-radius:8px;}
  :root[data-skin="editorial"] .eyebrow{font-weight:700;}
  /* Editorial NIGHT: dark ground, cream type; a couple of labels go brass
     for contrast against the burgundy. */
  :root[data-skin="editorial"]:not(.light) .bike span{color:#C7A998;}
  :root[data-skin="editorial"]:not(.light) .month-head .total{color:#D9A94A;}
  :root[data-skin="editorial"]:not(.light) .tab.active{color:#D9A94A;}

  #stripe{display:none; height:6px; flex:none;}
  #stripe i{display:block; height:100%;}
  #stripe .r{background:var(--accent); width:70%;}
  #stripe .b{background:var(--gauge); width:12%;}
  #stripe .k{background:var(--text); flex:1;}
  :root[data-skin="roadster"] #stripe{display:flex;}

  :root[data-skin="roadster"] .eyebrow{letter-spacing:.2em; font-weight:500;}
  :root[data-skin="roadster"] .odo-input input{letter-spacing:.06em;}
  :root[data-skin="roadster"] .bike{text-transform:uppercase; letter-spacing:.04em;}
  :root[data-skin="roadster"] .odo-input{border-bottom-style:dashed;}
  :root[data-skin="roadster"] nav{border-top-width:2px;}
  :root[data-skin="roadster"] .save-btn,
  :root[data-skin="roadster"] .btn.primary,
  :root[data-skin="roadster"] .gate-btn{
    font-family:var(--font-label); text-transform:uppercase; letter-spacing:.14em; font-weight:500;
  }
  :root[data-skin="roadster"] .gauge{border-radius:0; height:8px;}
  :root[data-skin="roadster"] .gauge i{border-radius:0;}
  :root[data-skin="roadster"] .save-btn{border-radius:6px;}
  :root[data-skin="roadster"] .gate-btn{border-radius:6px;}
  :root[data-skin="roadster"] .odo-card{box-shadow:3px 3px 0 rgba(28,20,12,.18);}
  :root[data-skin="roadster"] .save-btn{box-shadow:2px 2px 0 rgba(28,20,12,.55);}
  :root[data-skin="roadster"] .svc-sub{font-family:var(--font-meta); text-transform:uppercase; letter-spacing:.1em;}

  :root:not([data-skin="editorial"]):not([data-skin="roadster"]) .odo-input input{font-weight:300; letter-spacing:-.01em; font-size:3.8rem;}
  :root:not([data-skin="editorial"]):not([data-skin="roadster"]) header{border-bottom-color:transparent;}
  :root:not([data-skin="editorial"]):not([data-skin="roadster"]) .gate-title{text-transform:none; letter-spacing:-.01em; font-weight:300;}
  :root:not([data-skin="editorial"]):not([data-skin="roadster"]) .gauge{height:4px;}
  /* Dark Gauge: active tab keeps a neutral label, icon carries the accent. */
  :root:not([data-skin="editorial"]):not([data-skin="roadster"]) .tab.active{color:var(--text);}
  :root:not([data-skin="editorial"]):not([data-skin="roadster"]) .tab.active svg{fill:var(--accent);}
</style>
</head>
<body>

<!-- Roadster-only racing stripe (other skins hide it) -->
<div id="stripe" aria-hidden="true"><i class="r"></i><i class="b"></i><i class="k"></i></div>

<header>
  <div class="hdr-title">
    <div class="eyebrow">Ride &amp; service log</div>
    <div class="bike">Rebel 500 <span>· 27D8941</span></div>
  </div>
  <div class="right">

<script>
/* =====================================================================
   Motorcycle Log (ride & service tracker, formerly "Odo")
   Online-first: the app is gated behind Google sign-in and unlocks after a
   successful sync. All signed-in devices share one live cloud log;
   localStorage is just the write buffer between syncs.
   ===================================================================== */

const LS_KEY    = 'odo-state-v1';   // whole-state blob; bump suffix for migrations
const SYNC_KEY  = 'odo-sync';       // {email, lastSync, needsAuth}
const THEME_KEY = 'odo-theme';      // 'light' | 'dark'  (absent = automatic)
const SKIN_KEY  = 'odo-skin';       // 'gauge' | 'editorial' | 'roadster'

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmtMi = n => n.toLocaleString('en-US');
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
                                     : 'r' + Date.now() + Math.random().toString(16).slice(2));
const monthsBetween = (d1, d2) => (d2 - d1) / (1000*60*60*24*30.44);
const daysBetween   = (d1, d2) => Math.round((d2 - d1) / (1000*60*60*24));

/* Real clock now (the mockup pinned a demo date here). */
const TODAY = new Date();

/* ---------- SEED (first-run defaults, accurate as of 2026-06-09) ----------
   Seed records use *deterministic* ids and timestamps so that if two fresh
   devices seed independently and later sync, the merge dedupes them by id
   instead of doubling the history. User-created records get random ids. */
const SEED_TS = Date.parse('2026-06-09T00:00:00Z');
function seedState(){
  return {
    version: 1,
    rides: [
      {id:'seed-r-2026-06-07', date:'2026-06-07', odo:825, trip:31, updatedAt:SEED_TS},
      {id:'seed-r-2026-06-01', date:'2026-06-01', odo:794, trip:52, updatedAt:SEED_TS},
      {id:'seed-r-2026-05-25', date:'2026-05-25', odo:742, trip:38, updatedAt:SEED_TS},
      {id:'seed-r-2026-05-17', date:'2026-05-17', odo:704, trip:64, updatedAt:SEED_TS},
      {id:'seed-r-2026-05-09', date:'2026-05-09', odo:640, trip:40, updatedAt:SEED_TS},
    ],
    services: [
      {id:'seed-s-2026-04-02', date:'2026-04-02', odo:685, item:'600-mi service · Fremont Honda', updatedAt:SEED_TS},
    ],
    /* mode 'milestone': due at the next multiple of everyMi above lastOdo (Honda note *1).
       mode 'rolling': due everyMi after lastOdo. Time intervals always run from lastDate. */
    schedule: [
      {item:'Chain clean & lube',      mode:'rolling',   everyMi:400,   everyMo:null, lastOdo:685, lastDate:'2026-04-02', updatedAt:SEED_TS},
      {item:'Engine oil',              mode:'milestone', everyMi:8000,  everyMo:12,   lastOdo:685, lastDate:'2026-04-02', updatedAt:SEED_TS},
      {item:'Engine oil filter',       mode:'milestone', everyMi:16000, everyMo:null, lastOdo:685, lastDate:'2026-04-02', updatedAt:SEED_TS},
      {item:'4,000-mi check',          mode:'milestone', everyMi:4000,  everyMo:null, lastOdo:685, lastDate:'2026-04-02', updatedAt:SEED_TS},
      {item:'8,000-mi inspection',     mode:'milestone', everyMi:8000,  everyMo:null, lastOdo:685, lastDate:'2026-04-02', updatedAt:SEED_TS},
      {item:'Air cleaner',             mode:'milestone', everyMi:12000, everyMo:null, lastOdo:685, lastDate:'2026-04-02', updatedAt:SEED_TS},
      {item:'Spark plug & valves',     mode:'milestone', everyMi:16000, everyMo:null, lastOdo:685, lastDate:'2026-04-02', updatedAt:SEED_TS},
      {item:'Brake fluid (replace)',   mode:'rolling',   everyMi:null,  everyMo:24,   lastOdo:0,   lastDate:'2025-07-12', updatedAt:SEED_TS},
      {item:'Coolant (replace)',       mode:'rolling',   everyMi:null,  everyMo:36,   lastOdo:0,   lastDate:'2025-07-12', updatedAt:SEED_TS},
    ],
    warnAtMi: 100,   // turns orange within this many miles of due
    warnAtDays: 14,  // or within this many days
    showAtMi: 200,   // appears on home screen within this many miles
    showAtDays: 30,  // or within this many days
    updatedAt: SEED_TS,
  };
}

/* Blank slate for a device that hasn't synced yet. The seed is applied only
   on the account's very first sync (see syncNow), never shown to a visitor. */
function emptyState(){
  return {...seedState(), rides:[], services:[], schedule:[], updatedAt:0};
}

/* ---------- PERSISTENCE ---------- */
let state = emptyState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.rides) || !Array.isArray(s.services) || !Array.isArray(s.schedule)) return null;
    return s;
  }catch{ return null; }
}
function persist(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* Every mutation funnels through here: stamp the doc, persist, and queue a sync. */
function saveState(){
  state.updatedAt = Date.now();
  persist();
  scheduleSync();
}

/* ---------- DERIVED HELPERS ---------- */
const activeRides    = () => state.rides.filter(r => !r.deleted);
const activeServices = () => state.services.filter(s => !s.deleted);
/* Current odometer = highest reading we've logged. */
function currentOdo(){ return activeRides().reduce((m,r) => Math.max(m, r.odo), 0); }

/* Re-derive every ride's trip from its chronological predecessor.
   The earliest ride has no predecessor in the log, so it keeps its stored
   trip. Mutates the records in place (they're references into state.rides). */
function recomputeTrips(){
  const rs = activeRides().slice().sort((a,b) => a.date.localeCompare(b.date) || a.odo - b.odo);
  for(let i = 1; i < rs.length; i++) rs[i].trip = rs[i].odo - rs[i-1].odo;
}

/* Status for each schedule item: returns {dueLabel, pct, warn, overdue, ...} */
function svcStatus(s){
  const odo = currentOdo();
  let pctMi = null, miLeft = null;
  if (s.everyMi){
    let dueOdo;
    if (s.mode === 'milestone'){
      // next multiple of everyMi strictly above lastOdo (Honda manual note *1)
      dueOdo = (Math.floor(s.lastOdo / s.everyMi) + 1) * s.everyMi;
      const start = dueOdo - s.everyMi;
      pctMi = Math.min(1, Math.max(0, (odo - start) / s.everyMi));
    } else {
      dueOdo = s.lastOdo + s.everyMi;
      pctMi = Math.min(1, Math.max(0, (odo - s.lastOdo) / s.everyMi));
    }
    miLeft = dueOdo - odo;
  }
  let pctMo = null, daysLeft = null;
  if (s.everyMo){
    const last = new Date(s.lastDate);
    const dueDate = new Date(last); dueDate.setMonth(dueDate.getMonth() + s.everyMo);
    daysLeft = daysBetween(TODAY, dueDate);
    pctMo = Math.min(1, Math.max(0, monthsBetween(last, TODAY) / s.everyMo));
  }
  const pct = Math.max(pctMi ?? 0, pctMo ?? 0);
  const overdue = (miLeft !== null && miLeft < 0) || (daysLeft !== null && daysLeft < 0);
  const warn = overdue ||
    (miLeft !== null && miLeft <= state.warnAtMi) ||
    (daysLeft !== null && daysLeft <= state.warnAtDays);
  // whichever trigger comes first drives the label
  let dueLabel;
  if (overdue) dueLabel = 'Overdue';
  else {
    const parts = [];
    if (miLeft !== null) parts.push(`${fmtMi(miLeft)} miles`);
    if (daysLeft !== null) parts.push(`${daysLeft} days`);
    dueLabel = 'in ' + parts.join(' or ');
  }
  return {dueLabel, pct, warn, overdue, miLeft, daysLeft};
}

/* ---------- RENDER ---------- */
function render(){
  // Don't stomp the odometer field while the rider is mid-edit (a background
  // sync can call render() at any time).
  if (document.activeElement !== odoIn) setOdoDisplay();
  renderDueSummary();
  renderService();
  renderHistory();
}

function renderDueSummary(){
  const all = state.schedule.map(s => ({s, st: svcStatus(s)}))
    .sort((a,b) => b.st.pct - a.st.pct);
  const onHorizon = ({st}) => st.overdue ||
    (st.miLeft !== null && st.miLeft <= state.showAtMi) ||
    (st.daysLeft !== null && st.daysLeft <= state.showAtDays);
  // everything within the threshold, with a floor of three so the section never empties
  const items = all.filter((x, i) => i < 3 || onHorizon(x));
  $('#due-summary').innerHTML = items.map(({s,st}) => svcCard(s, st, false)).join('');
  const anyWarn = state.schedule.some(s => svcStatus(s).warn);
  $('#tab-service .dot').style.setProperty('--badge', anyWarn ? 'block' : 'none');
}

function svcCard(s, st, actionable){
  const subL = s.everyMi ? `every ${fmtMi(s.everyMi)} miles` : '';
  const subR = s.everyMo ? `every ${s.everyMo} months` : '';
  return `<div class="svc${actionable ? ' tappable' : ''}" data-item="${esc(s.item)}">
    <div class="svc-top">
      <span class="svc-name">${esc(s.item)}</span>
      <span class="svc-due${st.warn ? ' warn' : ''}">${st.dueLabel}</span>
    </div>
    <div class="gauge"><i class="${st.warn ? 'warn' : ''}" style="width:${Math.round(st.pct*100)}%"></i></div>
    <div class="svc-sub"><span>${subL}</span><span>${subR}</span></div>
    ${actionable ? `<div class="svc-actions"><div class="row">
        <button class="primary" data-done="${esc(s.item)}">Done today at ${fmtMi(currentOdo())} miles</button>
      </div></div>` : ''}
  </div>`;
}

function renderService(){
  const sorted = [...state.schedule].map(s => ({s, st: svcStatus(s)}))
    .sort((a,b) => b.st.pct - a.st.pct);
  $('#svc-list').innerHTML = sorted.map(({s,st}) => svcCard(s, st, true)).join('');
}

function renderHistory(){
  const all = [
    ...activeRides().map(r => ({...r, kind:'ride'})),
    ...activeServices().map(s => ({...s, kind:'service'})),
  ].sort((a,b) => b.date.localeCompare(a.date) || b.odo - a.odo);

  if (!all.length){
    $('#history-list').innerHTML = `<div class="history-empty">No rides logged yet.</div>`;
    return;
  }

  const byMonth = {};
  for (const e of all){
    const key = e.date.slice(0,7);
    (byMonth[key] ??= []).push(e);
  }
  $('#history-list').innerHTML = Object.entries(byMonth).map(([key, entries]) => {
    const total = entries.filter(e => e.kind==='ride').reduce((t,e) => t+e.trip, 0);
    const label = new Date(key + '-15').toLocaleDateString('en-US', {month:'long', year:'numeric'});
    return `<div class="month-block">
      <div class="month-head">
        <span class="eyebrow">${label}</span>
        <span class="total">${fmtMi(total)} miles</span>
      </div>
      ${entries.map(e => e.kind === 'ride'
        ? `<div class="ride" data-edit="ride" data-id="${esc(e.id)}">
             <span class="d">${dateLabel(e.date)}
               <small>${fmtMi(e.odo)} miles</small></span>
             <span class="trip">+${e.trip} <small>miles</small></span>
           </div>`
        : `<div class="ride service-row" data-edit="service" data-id="${esc(e.id)}">
             <span class="d">${dateLabel(e.date)}
               <small>service · ${fmtMi(e.odo)} miles</small></span>
             <span class="trip">${esc(e.item)}</span>
           </div>`
      ).join('')}
    </div>`;
  }).join('');
}

const dateLabel = iso => new Date(iso+'T12:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
/* Escape any value that lands in innerHTML (item names, ids). */
function esc(v){ return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- LOG: odometer entry ---------- */
const odoIn = $('#odo-in'), saveBtn = $('#save-ride'),
      tripLine = $('#trip-line'), tripVal = $('#trip-val');

function setOdoDisplay(){
  odoIn.value = currentOdo();
  tripLine.classList.remove('show');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Log Ride';
}

/* Tap the odometer, type the new reading over the selected value */
odoIn.addEventListener('focus', () => odoIn.select());

odoIn.addEventListener('input', () => {
  const v = parseInt(odoIn.value, 10);
  if (!odoIn.value || isNaN(v) || v === currentOdo()){
    tripLine.classList.remove('show'); saveBtn.disabled = true;
    saveBtn.textContent = 'Log Ride'; return;
  }
  const trip = v - currentOdo();
  tripLine.classList.add('show');
  if (trip < 0){
    tripVal.textContent = 'below current reading';
    tripVal.className = 'val neg'; saveBtn.disabled = true;
    saveBtn.textContent = 'Log Ride';
  } else {
    tripVal.textContent = '+' + fmtMi(trip) + ' miles';
    tripVal.className = 'val'; saveBtn.disabled = false;
    saveBtn.textContent = `Log Ride · +${fmtMi(trip)} miles`;
  }
});

/* Abandoned or invalid edit: settle back to the actual odometer.
   Blur fires before the save click; reverting only when the button is
   disabled means a valid save is never swallowed. Preserve this ordering. */
odoIn.addEventListener('blur', () => {
  if (saveBtn.disabled) setOdoDisplay();
});

saveBtn.addEventListener('click', () => {
  const v = parseInt(odoIn.value, 10);
  const trip = v - currentOdo();
  state.rides.unshift({id: uid(), date: todayISO(), odo: v, trip, updatedAt: Date.now()});
  saveState();
  $('#flash').textContent = `Ride saved · +${fmtMi(trip)} miles`;
  $('#flash').classList.add('show');
  setTimeout(() => $('#flash').classList.remove('show'), 1600);
  render();
});

/* ---------- TABS ---------- */
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.remove('active'));
  $$('.screen').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('#screen-' + t.dataset.screen).classList.add('active');
}));

/* ---------- SERVICE: tap to expand, "Done" resets the interval ---------- */
$('#svc-list').addEventListener('click', e => {
  const done = e.target.closest('[data-done]');
  if (done){
    const item = done.dataset.done;
    const s = state.schedule.find(x => x.item === item);
    s.lastOdo = currentOdo();
    s.lastDate = todayISO();
    s.updatedAt = Date.now();
    state.services.unshift({id: uid(), date: s.lastDate, odo: s.lastOdo, item, updatedAt: Date.now()});
    saveState();
    render();
    return;
  }
  const card = e.target.closest('.svc.tappable');
  if (card) card.classList.toggle('open');
});

/* ---------- HISTORY: tap a row to edit date/odo or delete ---------- */
let editing = null; // {kind, id}
$('#history-list').addEventListener('click', e => {
  const row = e.target.closest('[data-edit]');
  if (!row) return;
  openEdit(row.dataset.edit, row.dataset.id);
});

function recordFor(kind, id){
  return (kind === 'ride' ? state.rides : state.services).find(r => r.id === id);
}
function openEdit(kind, id){
  const rec = recordFor(kind, id);
  if (!rec) return;
  editing = {kind, id};
  $('#edit-title').textContent = kind === 'ride' ? 'Edit ride' : 'Edit service';
  $('#edit-date').value = rec.date;
  $('#edit-odo').value = rec.odo;
  $('#edit-status').textContent = '';
  showOverlay('#edit-overlay');
}
$('#edit-save').addEventListener('click', () => {
  const rec = recordFor(editing.kind, editing.id);
  if (!rec) return;
  const odo = parseInt($('#edit-odo').value, 10);
  const date = $('#edit-date').value;
  if (!date || isNaN(odo) || odo < 0){
    $('#edit-status').textContent = 'Enter a valid date and odometer.';
    return;
  }
  rec.date = date;
  rec.odo = odo;
  rec.updatedAt = Date.now();
  if (editing.kind === 'ride') recomputeTrips();
  saveState();
  render();
  hideOverlay('#edit-overlay');
});
$('#edit-delete').addEventListener('click', () => {
  const rec = recordFor(editing.kind, editing.id);
  if (!rec) return;
  // Tombstone (not a hard delete) so the deletion propagates through sync.
  rec.deleted = true;
  rec.updatedAt = Date.now();
  if (editing.kind === 'ride') recomputeTrips();
  saveState();
  render();
  hideOverlay('#edit-overlay');
});

/* ---------- OVERLAYS (shared show/hide) ---------- */
function showOverlay(sel){ $(sel).classList.add('show'); }
function hideOverlay(sel){ $(sel).classList.remove('show'); }
// Tap the dim backdrop (but not the sheet) to close.
$$('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); }));
$('[data-close-settings]').addEventListener('click', () => hideOverlay('#settings-overlay'));
$('[data-close-edit]').addEventListener('click', () => hideOverlay('#edit-overlay'));
$('#settings-btn').addEventListener('click', () => { refreshSyncUI(); showOverlay('#settings-overlay'); });

/* ---------- CLOUD SYNC ----------
   Identity is a Google account via the OAuth redirect flow: the gate's
   sign-in link leaves for /api/auth/google, Google bounces back through
   /api/auth/callback, and the server answers with a signed httpOnly session
   cookie that every later sync renews (30-day rolling expiry), so sign-in is
   a roughly once-a-month event per device, not a per-session one. The server
   keys the shared blob by account email. Merge is last-writer-wins per record
   (by updatedAt); deletions ride along as tombstones. */
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; }catch{ return null; } }
function syncConfigured(){ const c = syncCfg(); return !!(c && c.email); }

/* Server-issued failure codes from the OAuth round trip (?autherror=...). */
const AUTH_ERRORS = {
  not_allowed: 'That Google account is not allowed on this log.',
  access_denied: 'You declined the Google sign-in. Try again if that was a mistake.',
  state_mismatch: 'Sign-in security check failed. The page may have sat too long; try again.',
  token_exchange_failed: "Couldn't complete sign-in with Google. Try again.",
  no_id_token: 'Google did not return an identity token. Try again.',
  invalid_id_token: 'Could not read the identity token. Try again.',
  email_not_verified: 'That Google account email is not verified with Google.',
};

/* After the OAuth redirect lands back on '/', the session cookie is the only
   evidence of sign-in; ask the server who we are. Also recovers a device
   whose localStorage was cleared but whose cookie survived. */
async function probeSession(){
  try{
    const res = await fetch('/api/auth/me');
    if (!res.ok) return; // stay gated
    const { email } = await res.json();
    localStorage.setItem(SYNC_KEY, JSON.stringify({...(syncCfg() || {}), email, needsAuth: false}));
    refreshSyncUI();
    syncNow();
  }catch{
    setGateStatus("Can't reach the server. Check your connection and reload.", 'err');
  }
}

/* ---------- GATE ----------
   appUnlocked flips true on the first successful sync of this page load and
   back to false on sign-out or a lapsed session. While false, the gate covers
   the app. */
let appUnlocked = false;
function setGateStatus(msg, kind){
  const el = $('#gate-status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}
function refreshGate(){
  const c = syncCfg();
  const signedIn = syncConfigured() && !c.needsAuth;
  $('#gate').classList.toggle('show', !appUnlocked);
  $('#gate-signin').style.display = signedIn ? 'none' : '';
  if (!navigator.onLine)   setGateStatus('Offline. Connect to the internet to sign in.', 'err');
  else if (c?.needsAuth)   setGateStatus('Session expired. Sign in again.', 'err');
  else if (signedIn)       setGateStatus('Connecting…', '');
  // Signed out with no special condition: leave the status alone so an
  // ?autherror message from the redirect survives this refresh.
}

/* A 401 means the session lapsed (or the cookie was cleared). Re-gate the
   app and demand a fresh sign-in. */
function sessionExpired(){
  const c = syncCfg() || {};
  localStorage.setItem(SYNC_KEY, JSON.stringify({...c, needsAuth: true}));
  appUnlocked = false;
  refreshSyncUI();
}

function mergeById(x = [], y = [], key = 'id'){
  const m = new Map();
  for (const r of [...x, ...y]){
    const cur = m.get(r[key]);
    if (!cur || (r.updatedAt || 0) >= (cur.updatedAt || 0)) m.set(r[key], r);
  }
  return [...m.values()];
}
function mergeStates(a, b){
  // Doc-level fields (thresholds) come from whichever side was touched last.
  const base = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  const out = structuredClone(base);
  out.rides    = mergeById(a.rides,    b.rides,    'id');
  out.services = mergeById(a.services, b.services, 'id');
  out.schedule = mergeById(a.schedule, b.schedule, 'item');
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return out;
}

let syncing = false, syncTimer = null;
function scheduleSync(){
  if (!syncConfigured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1200); // debounce bursts of edits
}

async function syncNow(){
  if (!syncConfigured() || syncCfg().needsAuth || syncing) return;
  syncing = true;
  setSyncStatus('Syncing…', '');
  try{
    // 1. Pull remote (the session cookie is the credential)
    const res = await fetch('/api/state');
    if (res.status === 401) return sessionExpired();
    if (!res.ok) throw new Error('pull ' + res.status);
    const remoteText = await res.text();
    let remote = null;
    try{ const r = JSON.parse(remoteText); if (r && Array.isArray(r.rides)) remote = r; }catch{}
    // The account's very first sync: cloud empty, device empty. Start from
    // the seed so the maintenance schedule isn't blank.
    if (!remote && !state.rides.length && !state.services.length && !state.schedule.length)
      state = seedState();
    // 2. Merge into local
    if (remote) state = mergeStates(state, remote);
    persist();
    render();
    // 3. Push if we changed anything (or remote was empty)
    const localText = JSON.stringify(state);
    if (localText !== remoteText){
      const put = await fetch('/api/state', {
        method:'PUT', headers:{'content-type':'application/json'}, body: localText,
      });
      if (put.status === 401) return sessionExpired();
      if (!put.ok) throw new Error('push ' + put.status);
    }
    localStorage.setItem(SYNC_KEY, JSON.stringify({...syncCfg(), needsAuth: false, lastSync: Date.now()}));
    setSyncStatus('Synced · ' + new Date().toLocaleTimeString(), 'ok');
    appUnlocked = true;
    refreshGate();
  }catch(err){
    setSyncStatus('Offline or sync error (' + err.message + '). Saved locally.', 'err');
    if (!appUnlocked) setGateStatus("Can't reach the server (" + err.message + '). Retrying…', 'err');
  }finally{
    syncing = false;
  }
}

function setSyncStatus(msg, kind){
  const el = $('#sync-status');
  if (!el) return;
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}
function refreshSyncUI(){
  const c = syncCfg();
  $('#sync-account').textContent = syncConfigured() ? 'Signed in as ' + c.email : '';
  if (syncConfigured() && c.lastSync)
    setSyncStatus('Last synced · ' + new Date(c.lastSync).toLocaleString(), 'ok');
  else if (syncConfigured())
    setSyncStatus('Connected. Not synced yet.', '');
  else
    setSyncStatus('Not signed in.', '');
  refreshGate();
}
$('#sync-now').addEventListener('click', syncNow);
$('#sync-disconnect').addEventListener('click', async () => {
  try{ await fetch('/api/auth/logout', {method:'POST'}); }catch{}
  // A signed-out device keeps no copy of the log.
  localStorage.removeItem(SYNC_KEY);
  localStorage.removeItem(LS_KEY);
  state = emptyState();
  appUnlocked = false;
  render();
  hideOverlay('#settings-overlay');
  setGateStatus('', '');
  refreshSyncUI();
});

// Opportunistic syncs: returning to the app, or regaining the network.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', syncNow);
window.addEventListener('offline', refreshGate);
// Live sync: changes made on another device appear without interaction. For
// a gated-but-cookied page (e.g. opened before the cookie landed elsewhere),
// the same tick re-probes the session instead.
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (syncConfigured() && !syncCfg().needsAuth) syncNow();
  else if (!syncConfigured()) probeSession();
}, 30_000);

/* ---------- THEME ----------
   Automatic: follows the system day/night setting and tracks changes live.
   The toggle sets a manual override, persisted to localStorage. Absent key
   means automatic. */
const mqLight = matchMedia('(prefers-color-scheme: light)');
let themeOverride = localStorage.getItem(THEME_KEY); // 'light' | 'dark' | null

/* Skins: which of the three designs is active. Day/night (above) cuts
   across all of them. The status-bar color tracks both. */
const SKIN_COLORS = {
  gauge:     {dark:'#16181B', light:'#F4F4F2'},
  editorial: {dark:'#221C16', light:'#FAF6EF'},
  roadster:  {dark:'#171310', light:'#F3EDDF'},
};
let skin = localStorage.getItem(SKIN_KEY);
if (!SKIN_COLORS[skin]) skin = 'gauge';
document.documentElement.dataset.skin = skin; // applied pre-boot to avoid a flash

function applyTheme(){
  const light = themeOverride ? themeOverride === 'light' : mqLight.matches;
  document.documentElement.classList.toggle('light', light);
  $('#theme-toggle').innerHTML = light ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.64 13a1 1 0 0 0-1.05-.14 8 8 0 0 1-9.45-9.45A1 1 0 0 0 9.36 2 10 10 0 1 0 22 14.64a1 1 0 0 0-.36-1.64z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V2a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0l1.41 1.41a1 1 0 1 1-1.41 1.42L4.22 5.64a1 1 0 0 1 0-1.42zm12.73 12.73a1 1 0 0 1 1.42 0l1.41 1.41a1 1 0 0 1-1.41 1.42l-1.42-1.41a1 1 0 0 1 0-1.42zM1 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H2a1 1 0 0 1-1-1zm18 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.42l1.41-1.41a1 1 0 1 1 1.42 1.41l-1.41 1.42a1 1 0 0 1-1.42 0zM16.95 7.05a1 1 0 0 1 0-1.42l1.41-1.41a1 1 0 1 1 1.42 1.42l-1.41 1.41a1 1 0 0 1-1.42 0z"/></svg>';
  $('#theme-color-meta').setAttribute('content', SKIN_COLORS[skin][light ? 'light' : 'dark']);
}
function applySkin(name){
  skin = name;
  localStorage.setItem(SKIN_KEY, name);
  document.documentElement.dataset.skin = name;
  $$('#skin-list .skin-option').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.skinPick === name)));
  applyTheme();
}
$$('#skin-list .skin-option').forEach(btn =>
  btn.addEventListener('click', () => applySkin(btn.dataset.skinPick)));
mqLight.addEventListener('change', applyTheme); // only bites when no override
$('#theme-toggle').addEventListener('click', () => {
  const light = document.documentElement.classList.contains('light');
  themeOverride = light ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, themeOverride);
  applyTheme();
});

/* ---------- SERVICE WORKER ---------- */
function registerSW(){
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('/sw.js').catch(() => {});
}

/* ---------- BOOT ---------- */
function boot(){
  state = loadState() || emptyState();
  applySkin(skin);
  render();
  refreshSyncUI();              // gate stays up until the first sync succeeds
  const autherror = new URLSearchParams(location.search).get('autherror');
  if (autherror){
    setGateStatus(AUTH_ERRORS[autherror] || 'Sign-in failed (' + autherror + ').', 'err');
    history.replaceState(null, '', '/');
  }
  const c = syncCfg();
  if (c?.email && !c.needsAuth) syncNow();
  else probeSession();          // fresh load or post-redirect: the cookie decides
  registerSW();
}
boot();
</script>
</body>
